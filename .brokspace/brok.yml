# Brokspace workspace configuration.
# Reference: https://github.com/brokspace/brok/blob/main/docs/configuration.md
version: 1
workspace:
  submodules: true
index:
  include:
  - '**/*'
  exclude:
  - '**/.git/**'
  - '**/.brokspace/**'
  - '**/target/**'
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/*.lock'
  - '**/*.min.js'
  - '**/pnpm-lock.yaml'
  - '**/package-lock.json'
  max_file_kb: 512
  max_chunk_lines: 120
  store: auto
embeddings:
  enabled: true
  model: nomic-embed-text-v1.5
  variant: quantized
  dimensions: 768
  device: auto
  batch_size: 16
search:
  limit: 8
  cold_weight: 0.85
llm:
  default: ollama
  providers:
    anthropic:
      base_url: https://api.anthropic.com/v1
      model: claude-sonnet-5-5
      api_key_env: ANTHROPIC_API_KEY
    deepseek:
      base_url: https://api.deepseek.com/v1
      model: deepseek-chat
      api_key_env: DEEPSEEK_API_KEY
    lmstudio:
      base_url: http://localhost:1234/v1
      model: qwen2.5-coder-7b-instruct
    ollama:
      base_url: http://localhost:11434/v1
      model: qwen2.5-coder:7b
sync:
  backend: none
shards:
  brok-agent:
    enabled: true
    settings:
      review:
        enabled: false
        exclude:
        - '**/*.md'
        include:
        - src/api/**
      watch_interval_secs: 5
